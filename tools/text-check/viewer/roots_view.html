</style></head><body>
<h1 id="title">Корни мысли</h1>
<p class="mut">Щёлкни подчёркнутую фразу, чтобы увидеть её родство в истории мысли, или точку на графике, чтобы найти фразу в тексте. Сходство не значит заимствование, расхождение не значит ошибку.</p>
<div id="datawarn"></div>
<div class="lensbar" id="lensbar"></div>
<div class="meaning" id="author"></div>
<div class="meaning" id="meaning"></div>
<div class="top" id="top"></div>
<div class="wrap">
 <div class="text" id="text"></div>
 <div class="side">
  <div class="legend" id="legend"></div>
  <div id="chart"></div>
  <div class="nodate" id="nodate"></div>
  <div class="card" id="card"><span class="mut">Выбери фразу или точку.</span></div>
  <div class="bars" id="bars" style="margin-top:1rem"></div>
 </div>
</div>
<script>
const PAYLOAD=/*__PAYLOAD__*/null;
(async function(){
let P=PAYLOAD;
if(!P){const u=new URLSearchParams(location.search).get('report');
 if(!u){document.getElementById('text').innerHTML='<p class="mut">Отчёт не загружен.</p>';return}
 try{P=await (await fetch(u)).json()}catch(e){document.getElementById('text').innerHTML='<p class="dwarn">Не удалось загрузить отчёт: '+String(e)+'</p>';return}}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const REL={"совпадает":"--ok","развивает":"--dev","перекликается":"--q","расходится":"--bad"};
const ROWS=["совпадает","развивает","перекликается","расходится"];
const R=P.roots||[],LENSES=P.lenses||[],TEXT=P.text||"",DW=[];
document.title=P.title||'Корни мысли';document.getElementById('title').textContent=P.title||'Корни мысли';
let LENS=null,SEL=null;
// ---------- источники: все, включая без года; дубликаты считаются один раз
const S=[],seen=new Set();
R.forEach((t,ti)=>(t.sources||[]).forEach(s=>{const k=[s.who,s.work,s.relation,ti].join('|');if(seen.has(k)){DW.push(`дубликат источника «${s.who}» у тезиса ${ti+1} учтён один раз`);return}
 seen.add(k);if(!REL[s.relation]){DW.push(`неизвестное отношение «${s.relation}» у «${s.who}»`);return}
 S.push(Object.assign({ti,verified:/официально/.test(s.tag||'')&&!!s.url},s))}));
// ---------- разметка текста в браузере: n-е вхождение, совместные фразы, переносы строк
const norm=x=>x.toLowerCase().replace(/ё/g,'е');const NT=norm(TEXT);
const spans={};
R.forEach((t,ti)=>(t.fragments||[]).forEach(f=>{const fx=typeof f==='string'?f:f.text,occ=typeof f==='string'?1:(f.occurrence||1);
 if(!fx){return}let i=-1,from=0;for(let k=0;k<occ;k++){i=NT.indexOf(norm(fx),from);if(i<0)break;from=i+1}
 if(i<0){DW.push(`фраза тезиса ${ti+1} не найдена в тексте: «${fx.slice(0,60)}»`);return}
 const key=i+':'+(i+fx.length);(spans[key]=spans[key]||{a:i,b:i+fx.length,ts:[]}).ts.push(ti)}));
let list=Object.values(spans).sort((x,y)=>x.a-y.a||y.b-x.b),kept=[],end=-1;

const lines=[];let buf='',pos=0;
const push=(str,cls,ts)=>{str.split('\n').forEach((part,k)=>{if(k>0){lines.push(buf);buf=''}
 if(part)buf+=cls?`<mark class="${cls}" data-ts="${ts}">${esc(part)}</mark>`:esc(part)})};
kept.forEach(s=>{push(TEXT.slice(pos,s.a));const t0=R[s.ts[0]];
 const cls='fr'+(s.ts.every(x=>!(R[x].sources||[]).length)?' own':'')+(s.ts.some(x=>R[x].implicit)?' imp':'');
 push(TEXT.slice(s.a,s.b),cls,s.ts.join(' '));pos=s.b});push(TEXT.slice(pos));lines.push(buf);
document.getElementById('text').innerHTML=lines.filter(l=>l.trim()).map(l=>`<p>${l}</p>`).join('');
const marks=[...document.querySelectorAll('mark.fr')];const mts=m=>m.dataset.ts.split(' ').map(Number);
// ---------- проверки данных
if(!P.meaning)DW.push('смысл текста (meaning) не указан');
R.forEach((t,ti)=>{if(t.contested!==undefined&&typeof t.contested!=='boolean')DW.push(`у тезиса ${ti+1} contested не true/false, считается false`);
 if(!(t.sources||[]).length&&!t.search)DW.push(`у тезиса ${ti+1} нет источников и не записан статус поиска`)});
{const UA={"всі": "все", "усі": "все", "усе": "все", "всіх": "всех", "усіх": "всех", "всім": "всем", "усім": "всем", "будь": "любой", "завжди": "всегда", "ніколи": "никогда", "тільки": "только", "лише": "только", "нічого": "ничего", "ніщо": "ничто", "жодний": "никакой", "жоден": "никакой", "жодна": "никакая", "жодне": "никакое", "цілком": "целиком", "повністю": "полностью", "кожний": "всякий", "кожен": "всякий"};const W=x=>new Set(((x||'').toLowerCase().replace(/ё/g,'е').match(/[а-яa-zіїєґ']+/g)||[]).map(w=>UA[w]||w));
 const INF=['все','всех','всем','всякий','всякая','всякое','любой','любая','любое','любые','любую','всегда','никогда','только','ничто','ничего','никакой','никакая','никакое','целиком','полностью'];
 const VRD=['на самом деле','в действительности','ошибается','ошибочно','неправ','не прав','опровергает','опровергнут','заблуждается','прав ','правы ','осмыслен','справедлив'];
 const NL=['в посте его нет','в посте этого нет','в тексте этого нет','в тексте его нет','этот лагерь','этого лагеря','не касается','в самом посте','в самом тексте'];
 R.forEach((t,ti)=>{const fw=W((t.fragments||[]).map(f=>typeof f==='string'?f:(f&&f.text)||'').join(' ')+' '+(t.thesis||''));
  (t.sources||[]).forEach(s=>{const pw=W(s.post||s.vs),add=INF.filter(w=>pw.has(w)&&!fw.has(w));
   if(add.length)DW.push(`тезис ${ti+1}, ${s.who}: в пересказе тезиса слова, которых нет в тексте (${add.join(', ')}) — возможна подмена`);
   const pl=(s.point||s.vs||'').toLowerCase().replace(/ё/g,'е'),pw2=W(pl),v=VRD.filter(x=>x.trim().includes(' ')?pl.includes(x):pw2.has(x.trim()));
   const cd=[s.post,s.point,s.vs].join(' ').toLowerCase().replace(/ё/g,'е'),nl=NL.filter(x=>cd.includes(x));
   if(nl.length)DW.push(`тезис ${ti+1}, ${s.who}: похоже на связь с позицией, а не с текстом (${nl.join(', ')})`);
   if(v.length)DW.push(`тезис ${ti+1}, ${s.who}: «${s.relation==='расходится'?'расходятся в':'сходятся в'}» похоже на вердикт (${v.join(', ').trim()})`)})})}
if(DW.length)document.getElementById('datawarn').innerHTML=`<div class="dwarn"><b>Замечания к данным отчёта</b><br>${DW.map(esc).join('<br>')}</div>`;
// ---------- статус тезиса
const status=t=>(t.sources||[]).length?'found':(t.search&&t.search.status)||'not_searched';
const isOwn=t=>status(t)==='searched_not_found';
const side=r=>r==="расходится"?"contra":(r==="совпадает"||r==="развивает")?"pro":null;
function balance(ti){const t=R[ti];if(t.contested!==true)return [];const out=[],src=S.filter(x=>x.ti===ti);
 const sd=new Set(src.map(x=>side(x.relation)).filter(Boolean));
 if(sd.size<2)out.push(sd.has('pro')?'найдены только совпадения':sd.has('contra')?'найдены только расхождения':'нет ни совпадений, ни расхождений');
 LENSES.forEach(l=>{if(src.some(x=>x.lens===l.id))return;const ls=(t.lens_search||{})[l.id];
  out.push(ls&&ls.status==='searched_not_found'?`позиция «${l.name}»: искали, не нашли (запросы: ${(ls.queries||[]).join('; ')})`:`позиция «${l.name}» не представлена ни одним источником, поиск не записан`)});
 const unv=src.filter(x=>!x.verified).length;if(unv)out.push(`из ${src.length} связей не проверено ${unv}`);
 if(t.search&&t.search.status==='searched_not_found_opposite')out.push('противоположная сторона искалась отдельно и не найдена');
 return out}
// ---------- смысл, автор, линзы
const lensLabel=l=>l.source==='people'?`читатели позиции «${l.name}»`:`модель в роли позиции «${l.name}»`;
function renderMeaning(){const box=document.getElementById('meaning');const L=LENSES.find(l=>l.id===LENS);
 if(L)box.innerHTML=`<span>Как текст читает ${esc(lensLabel(L))}</span>${esc(L.meaning)}`+(L.against?`<div class="mut" style="margin-top:4px">С чем спорит, по мнению этой позиции: ${esc(L.against)}</div>`:'');
 else box.innerHTML=P.meaning?'<span>Что текст говорит (нейтральный слой, по пересказам слепых читателей, без оценки)</span>'+esc(P.meaning):'<span>Смысл текста не указан</span>';}
if(P.axis_note){const d=document.createElement('p');d.className='mut';d.textContent='Ось спора: '+P.axis_note;document.getElementById('lensbar').after(d)}
if(P.author_reading)document.getElementById('author').innerHTML='<span>Прочтение автора — последнее слово о замысле, но не о правоте и не о том, что утверждает источник</span>'+esc(P.author_reading);
else document.getElementById('author').style.display='none';
// ---------- сводка
function renderTop(){const src=S.filter(x=>!LENS||x.lens===LENS);const ys=src.filter(x=>typeof x.year==='number').map(x=>x.year);
 const yl=y=>y<0?Math.abs(y)+" до н. э.":String(y);const tr=new Set(src.map(x=>x.tradition).filter(Boolean));
 const span=ys.length?Math.max(...ys)-Math.min(...ys):0;
 document.getElementById('top').innerHTML=[
  [ys.length?"≈"+Math.round(span/100)+" в.":"—","охват родства"+(ys.length?` (${yl(Math.min(...ys))} — ${yl(Math.max(...ys))})`:"")],
  [tr.size,"традиций и дисциплин"],
  [`${src.length}`,`связей, из них проверено по источнику ${src.filter(x=>x.verified).length}`],
  [R.filter(isOwn).length,"тезисов: искали — близкого источника не нашли"],
  [R.filter(t=>status(t)==='not_searched').length,"тезисов без поиска"],
  [R.filter((t,i)=>balance(i).length).length,"спорных тезисов с замечаниями о балансе"]]
  .map(([b,s])=>`<div><b>${b}</b><span>${s}</span></div>`).join("")}
document.getElementById('legend').innerHTML=ROWS.map(r=>`<span><i style="background:var(${REL[r]})"></i>${r}</span>`).join("")+
 `<span><i style="background:var(--own)"></i>искали, не нашли</span><span><i style="border:1px dashed var(--mut)"></i>гипотеза, не проверено</span>`;
// ---------- график: точки не выходят за край, совпадающие даты складываются по вертикали
(function(){const dated=S.map((x,i)=>[x,i]).filter(([x])=>typeof x.year==='number');
 const W=560,H=380,ns="http://www.w3.org/2000/svg";
 if(!dated.length){document.getElementById('chart').innerHTML='<p class="mut">У источников не указаны годы.</p>'}
 else{const ys=dated.map(([x])=>x.year),mn=Math.min(...ys),mx=Math.max(...ys),L=95,Rt=W-20;const ancient=mn<1800&&mx>1800;
 const X=y=>{if(!ancient)return L+(y-mn)/((mx-mn)||1)*(Rt-L);const cut=L+(Rt-L)*0.22;return y<1800?L+(y-mn)/((1800-mn)||1)*(cut-L):cut+(y-1800)/((mx-1800)||1)*(Rt-cut)};
 const Y=r=>50+ROWS.indexOf(r)*82;
 const s=document.createElementNS(ns,'svg');s.setAttribute('viewBox',`0 0 ${W} ${H}`);s.setAttribute('width','100%');
 const el=(n,a,t,p)=>{const e=document.createElementNS(ns,n);for(const k in a)e.setAttribute(k,a[k]);if(t!=null)e.textContent=t;(p||s).appendChild(e);return e};
 ROWS.forEach(r=>{el('line',{x1:L,x2:Rt,y1:Y(r),y2:Y(r),stroke:css('--line'),'stroke-dasharray':'2 4'});el('text',{x:4,y:Y(r)+4,'font-size':11,opacity:.6},r)});
 if(ancient)el('line',{x1:L+(Rt-L)*0.22,x2:L+(Rt-L)*0.22,y1:20,y2:H-30,stroke:css('--line')});
 (ancient?[mn,1800,mx]:[mn,Math.round((mn+mx)/2),mx]).forEach(y=>el('text',{x:X(y),y:H-8,'font-size':10,opacity:.5,'text-anchor':'middle'},y<0?Math.abs(y)+" до н. э.":String(y)));
 const used={},dots={};
 dated.forEach(([src,i])=>{let x=Math.min(Rt,Math.max(L,X(src.year)));const base=Y(src.relation);const dd=dots[src.relation]=dots[src.relation]||[];
  let tries=0;while(dd.some(o=>Math.abs(o-x)<13)&&tries<3){x=Math.min(Rt,x+13);tries++}
  const stack=dd.filter(o=>Math.abs(o-x)<13).length;const y=base+(stack?((stack%2?1:-1)*Math.ceil(stack/2)*9):0);dd.push(x);
  const g=el('g',{class:'node','data-i':i});
  el('circle',{cx:x,cy:y,r:7,fill:src.verified?css(REL[src.relation]):css('--bg'),stroke:css(REL[src.relation]),'stroke-width':2,'stroke-dasharray':src.verified?'':'3 2'},null,g);
  const u=used[src.relation]=used[src.relation]||[];const w=src.who.length*6.2+8;
  const anc=x>Rt-40?'end':x<L+30?'start':'middle';const cx=anc==='end'?x+8-w/2:anc==='start'?x-8+w/2:x;
  const slots=[base-14,base+23,base-33,base+42];let ly=null;
  for(const sy of slots){if(!u.some(o=>o.y===sy&&Math.abs(o.x-cx)<(o.w+w)/2)){ly=sy;break}}
  if(ly!==null){u.push({x:cx,y:ly,w});el('text',{x:anc==='end'?x+8:anc==='start'?x-8:x,y:ly,'font-size':11,'text-anchor':anc},src.who,g)}
  el('title',{},`${src.who}${src.year_label?', '+src.year_label:''}`,g);
  g.addEventListener('click',()=>{SEL={type:'source',id:i};apply()})});
 document.getElementById('chart').appendChild(s)}
 const nd=S.map((x,i)=>[x,i]).filter(([x])=>typeof x.year!=='number');
 if(nd.length)document.getElementById('nodate').innerHTML='<span class="mut">Без даты (на графике не показаны):</span> '+nd.map(([x,i])=>`<button data-i="${i}">${esc(x.who)}</button>`).join('');
 document.querySelectorAll('#nodate button').forEach(b=>b.onclick=()=>{SEL={type:'source',id:+b.dataset.i};apply()})})();
// ---------- карточки
function srcHtml(s){const c=css(REL[s.relation]);const link=s.url?` · <a href="${esc(s.url)}" target="_blank" rel="noopener">источник</a>`:"";
 const lens=s.lens?`<span class="lensb">${esc((LENSES.find(l=>l.id===s.lens)||{}).name||s.lens)}</span>`:(LENSES.length?'<span class="lensb">общий</span>':'');
 return `<div class="src" style="border-color:${c}"><span class="badge" style="background:${c}">${esc(s.relation)}</span><b>${esc(s.who)}</b>${lens}${s.verified?'':'<span class="hyp">гипотеза, не проверено по источнику</span>'}
 <span class="mut">${esc(s.work||"")} ${esc(s.year_label||"")} ${esc(s.tag||"")}${link}</span>
 ${cardBody(s)}</div>`}
function cardBody(s){if(!s.post&&!s.point)return `<div class="cols"><div><span>у него</span>${esc(s.idea||'')}</div><div><span>у тебя</span>${esc(s.vs||'')}</div></div><div class="warn">карточка в старом формате</div>`;
 const pl=s.relation==='расходится'?'расходятся в':'сходятся в';
 return `<div class="rows"><div><span>пост</span>${esc(s.post||'')}</div><div><span>источник</span>${esc(s.idea||'')}</div><div><span>${pl}</span>${esc(s.point||'')}</div></div>`}
function head(ti){const t=R[ti];const bw=balance(ti);
 const imp=t.implicit?(t.basis==='author'?'<div class="mut">невысказанный тезис, сформулирован автором</div>':(t.from_readers||[]).length?`<div class="mut">невысказанный тезис, восстановлен по пересказам читателей: ${esc(t.from_readers.join(', '))}</div>`:'<div class="warn">невысказанный тезис — гипотеза координатора: ответы читателей к нему не приложены</div>'):'';
 const alt=(t.alternatives||[]).map(a=>typeof a==='object'&&a&&a.reader?`<div class="mut">так понял читатель ${esc(a.reader)}: ${esc(a.reading||'')}</div>`:`<div class="warn">другое прочтение без читателя: ${esc(typeof a==='object'?JSON.stringify(a):a)}</div>`).join('');
 const bas={author:'тезис словами автора',text:'тезис прямо из текста',readers:'тезис по прочтению слепых читателей'}[t.basis];
 const bl=bas?`<div class="mut">${bas}</div>`:'<div class="warn">не указано, откуда тезис</div>';
 const lvl=t.level?`<span class="lvl">${esc(t.level)}</span>`:'';
 const st={'searched_not_found':'<div class="src" style="border-color:var(--own)"><span class="badge" style="background:var(--own)">искали, не нашли</span>'+esc(t.own||'')+(t.search&&t.search.queries?`<div class="mut">запросы: ${esc(t.search.queries.join('; '))}</div>`:'')+'</div>',
  'not_searched':'<div class="mut">Поиск источников для этого тезиса не проводился.</div>'}[status(t)]||'';
 return (bw.length?`<div class="warn">Баланс: ${esc(bw.join('; '))}</div>`:'')+imp+bl+alt+`<h3>${lvl}${esc(t.thesis)}</h3>`+st}
function apply(){const card=document.getElementById('card');const vis=x=>!LENS||x.lens===LENS||!x.lens;
 let ts=new Set(),is=new Set();
 if(!SEL){card.innerHTML='<span class="mut">Выбери фразу или точку.</span>'}
 else if(SEL.type==='thesis'){ts.add(SEL.id);S.forEach((x,i)=>{if(x.ti===SEL.id&&vis(x))is.add(i)});
  const hidden=S.filter(x=>x.ti===SEL.id&&!vis(x)).length;
  card.innerHTML=head(SEL.id)+S.filter(x=>x.ti===SEL.id&&vis(x)).map(srcHtml).join('')+(hidden?`<div class="mut">Ещё ${hidden} источн. скрыто текущей линзой.</div>`:'')}
 else if(SEL.type==='source'){const s=S[SEL.id];ts.add(s.ti);is.add(SEL.id);card.innerHTML=head(s.ti)+srcHtml(s)+(vis(s)?'':'<div class="mut">Этот источник относится к другой позиции.</div>')}
 else if(SEL.type==='trad'){const src=S.map((x,i)=>[x,i]).filter(([x])=>(x.tradition||'без традиции')===SEL.id&&vis(x));
  src.forEach(([x,i])=>{ts.add(x.ti);is.add(i)});
  card.innerHTML=`<h3>${esc(SEL.id)}: где связь с текстом</h3>`+(src.length?src.map(([x])=>head(x.ti)+srcHtml(x)).join(''):'<div class="mut">В текущей линзе связей этой традиции нет.</div>')}
 marks.forEach(m=>{const t=mts(m);m.classList.toggle('on',t.some(x=>ts.has(x)));m.style.opacity=!LENS||t.some(x=>(R[x].sources||[]).some(s=>s.lens===LENS||!s.lens))?1:.45});
 document.querySelectorAll('svg .node').forEach(n=>{const i=+n.dataset.i;n.classList.toggle('dim2',!vis(S[i]));n.classList.toggle('dim',!!SEL&&!is.has(i))});
 document.querySelectorAll('.brow[data-tr]').forEach(r=>r.classList.toggle('sel',!!SEL&&SEL.type==='trad'&&r.dataset.tr===SEL.id));
 renderMeaning();renderTop()}
// ---------- традиции
function renderBars(){const vis=x=>!LENS||x.lens===LENS||!x.lens;const src=S.filter(vis);const g={};
 src.forEach(x=>{const t=x.tradition||'без традиции';g[t]=g[t]||{pro:0,pu:0,con:0,cu:0,echo:0};
  if(x.relation==='расходится'){g[t].con++;if(!x.verified)g[t].cu++}else if(x.relation==='перекликается')g[t].echo++;else{g[t].pro++;if(!x.verified)g[t].pu++}});
 const rows=Object.entries(g).sort((a,b)=>(b[1].pro-b[1].con)-(a[1].pro-a[1].con)||(b[1].pro+b[1].con)-(a[1].pro+a[1].con));
 const mx=Math.max(1,...rows.map(([,v])=>Math.max(v.pro,v.con)));
 const bar=(n,u,col,dir)=>{const v=n-u;const a=`<i style="width:${100*v/mx}%;background:${col}"></i>`,b=u?`<i class="u" style="width:${100*u/mx}%;background:${col}"></i>`:'';return dir<0?b+a:a+b};
 document.getElementById('bars').innerHTML=rows.length?'<div class="mut" style="margin-bottom:6px">Связи подобранных источников по школам мысли: число связей, а не позиция школы в целом. Бледная часть — гипотезы, не проверенные по источнику. Щёлкни строку — подсветятся связи в тексте и на графике.</div>'+
  '<div class="brow head"><div></div><div style="text-align:right">в споре</div><div></div><div>в согласии</div><div></div></div>'+
  rows.map(([n,v])=>`<div class="brow" data-tr="${esc(n)}"><div class="bn">${esc(n)}</div>
   <div class="bl">${v.con?`<span>${v.con}</span>`+bar(v.con,v.cu,'var(--bad)',-1):''}</div><div class="bc"></div>
   <div class="br">${v.pro?bar(v.pro,v.pu,'var(--ok)',1)+`<span>${v.pro}</span>`:''}</div>
   <div class="be">${v.echo?`<span title="перекликается">≈${v.echo}</span>`:''}</div></div>`).join(''):'';
 document.querySelectorAll('.brow[data-tr]').forEach(r=>r.onclick=()=>{SEL={type:'trad',id:r.dataset.tr};apply()})}
// ---------- линзы
if(LENSES.length){const bar=document.getElementById('lensbar');const btn=(id,name)=>`<button data-l="${id??''}">${esc(name)}</button>`;
 bar.innerHTML='<span class="mut" style="align-self:center;margin-right:4px">Линза:</span>'+btn(null,'нейтрально')+LENSES.map(l=>btn(l.id,l.name)).join('');
 bar.querySelectorAll('button').forEach(b=>b.onclick=()=>{LENS=b.dataset.l||null;bar.querySelectorAll('button').forEach(x=>x.classList.toggle('on',(x.dataset.l||null)===LENS));renderBars();apply()});
 bar.querySelector('button[data-l=""]').classList.add('on')}
marks.forEach(m=>m.addEventListener('click',()=>{SEL={type:'thesis',id:mts(m)[0]};apply()}));
renderBars();apply();
})();
</script></body></html>
